
name: Build AutoCombatClient

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source ZIP
        run: |
          mkdir -p project
          unzip -o AutoCombatClient-Source.zip -d project
          test -f project/build.gradle

      - name: Fix mappings configuration
        run: |
          sed -i '/mappings loom\.officialMojangMappings()/d' project/build.gradle
          echo "Updated mappings configuration:"
          cat project/build.gradle

      - name: Build Fabric mod
        working-directory: project
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCombatClient-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
          
