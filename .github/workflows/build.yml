
name: Build AutoCombatClient

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Check source ZIP
        run: |
          ls -la
          test -f AutoCombatClient-Source.zip

      - name: Extract source project
        run: |
          mkdir -p project
          unzip -o AutoCombatClient-Source.zip -d project
          ls -la project
          test -f project/build.gradle
          test -f project/settings.gradle

      - name: Build Fabric mod
        working-directory: project
        run: gradle build --no-daemon --stacktrace --info

      - name: List generated JAR files
        if: success()
        run: find project/build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoCombatClient-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
          
